# schema: https://scanner.dev/schema/scanner-detection-rule.v1.json
name: Tines Story Jobs Clearance
description: |-
  Detect when a user has cleared story jobs in Tines.
  This can indicate potential data destruction or
  unauthorized workflow management.
enabled: true
severity: Low
query_text: |-
  @scnr.source_type:tines
  operation_name:StoryJobsClearance
  | groupbycount(user_email)
  | where @q.count > 0
time_range_s: 300
run_frequency_s: 60
event_sink_keys:
- low_severity_alerts
tags:
- tactics.ta0040.impact
- techniques.t1485.data_destruction
- source.tines
