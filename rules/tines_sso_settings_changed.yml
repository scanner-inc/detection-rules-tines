# schema: https://scanner.dev/schema/scanner-detection-rule.v1.json
name: Tines SSO Settings Changed
description: |-
  Detect when Tines SSO settings are changed. This can indicate
  potential compromise of authentication infrastructure or unauthorized
  changes to access controls.
severity: High
query_text: |-
  @scnr.source_type:tines
  operation_name:(SsoConfigurationDefaultSet SsoConfigurationSamlSet SsoConfigurationOidcSet)
  | groupbycount(user_email)
  | where @q.count > 0
time_range_s: 300
run_frequency_s: 60
event_sink_keys:
- high_severity_alerts
tags:
- tactics.ta0004.privilege_escalation
- techniques.t1484.domain_policy_modification
- source.tines
