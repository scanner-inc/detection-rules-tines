# schema: https://scanner.dev/schema/scanner-detection-rule.v1.json
name: Tines Multiple Actions "Disabled" Property Changed
description: |-
  Detect when multiple Tines Actions have their "Disabled" property changed.
  This can indicate potential disruption of automation workflows or security
  controls.
enabled: true
severity: Medium
query_text: |-
  %ingest.source_type:tines
  operation_name:ActionsDisabledChange
  | groupbycount(user_email)
  | where @q.count > 0
time_range_s: 300
run_frequency_s: 60
event_sink_keys:
- medium_severity_alerts
tags:
- tactics.ta0005.defense_evasion
- techniques.t1562.impair_defenses
- source.tines
