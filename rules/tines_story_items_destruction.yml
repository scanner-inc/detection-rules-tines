# schema: https://scanner.dev/schema/scanner-detection-rule.v1.json
name: Tines Story Items Destruction
description: |-
  Detect when a user has destroyed a story item in Tines.
  This can indicate potential data destruction or
  unauthorized workflow management.
enabled: true
severity: Informational
query_text: |-
  %ingest.source_type:"tines:audit"
  operation_name:StoryItemsDestruction
  | groupbycount(user_email)
  | where @q.count > 0
time_range_s: 300
run_frequency_s: 60
event_sink_keys:
- informational_severity_alerts
tags:
- tactics.ta0040.impact
- techniques.t1485.data_destruction
- source.tines
